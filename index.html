<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Mural Digital - Ituiutaba</title>

    <link rel="icon" type="image/png" href="/isologo-mural-digital.png?v=2">
    <link rel="apple-touch-icon" href="/isologo-mural-digital.png?v=2">

    <link rel="stylesheet" href="style.css?v=9.4.1-spotify-tv">
</head>
<body>

    <section class="tela ativa" id="tela-tempo" data-duration="25000">
        <video autoplay muted loop playsinline preload="auto" id="weather-video">
            <source src="assets/ceu-limpo.mp4" type="video/mp4">
        </video>

        <div class="glass-ui">
            <div class="weather-layout">

                <div class="clock-side">
                    <div id="relogio">00:00:00</div>
                    <div id="data-extenso">Carregando data...</div>
                </div>

                <div class="info-side">
                    <div id="cidade">ITUIUTABA</div>
                    <div id="temp-valor">--°C</div>
                    <div id="condicao">CARREGANDO...</div>

                    <div class="temp-range">
                        <span id="temp-max">Máx: --°C</span>
                        <span class="divider">|</span>
                        <span id="temp-min">Mín: --°C</span>
                    </div>
                </div>

            </div>
        </div>

        <div class="credito-desenvolvedor">
            Desenvolvido por <span>Jeferson Augusto</span>
        </div>
    </section>

    <div id="container-midias-youtube"></div>
    <div id="container-eventos"></div>
    <div id="container-imagens-dinamicas"></div>
    <div id="container-musicas-youtube"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
    <script src="script.js?v=9.4.1-spotify-tv"></script>

</body>
</html>
